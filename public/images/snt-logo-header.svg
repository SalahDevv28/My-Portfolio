<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A near-black rounded square with a thin gradient border outline, a gradient hub centered in the middle of the icon, connected by eleven thicker gradient lines of varied non-sequential length to eleven outer nodes of varying size at irregular positions</desc>
